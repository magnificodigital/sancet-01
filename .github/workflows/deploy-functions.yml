name: Deploy Supabase Edge Functions

# Substitui o deploy automático que a Lovable fazia.
# Publica as Edge Functions no projeto Supabase sempre que algo em
# supabase/functions ou no config.toml muda no main — e também sob demanda
# pelo botão "Run workflow" (workflow_dispatch).
#
# Pré-requisito: criar o secret SUPABASE_ACCESS_TOKEN no GitHub
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# O token sai de: Supabase -> Account -> Access Tokens -> Generate new token.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy todas as Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Sem nome de função = publica todas; o config.toml define verify_jwt
        # por função. A pasta _shared é ignorada pelo CLI (prefixo "_").
        run: supabase functions deploy --project-ref bczqebeixeunhzpisurh
